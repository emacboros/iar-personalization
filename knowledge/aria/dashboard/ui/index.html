<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aria.randazzo.ar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cortex"></canvas>
<div id="hud">
  <div class="hud-col" id="hud-agents"></div>
  <div class="hud-col" id="hud-house"></div>
  <div class="hud-col" id="hud-host"></div>
</div>
<div id="oq-panel" class="hidden">
  <h2>open questions <span id="oq-hint">relay queue awaiting you &mdash; oldest first</span></h2>
  <div id="oq-list"></div>
</div>
<div id="oq-tab" title="open questions">questions <span id="oq-count"></span></div>
<div id="board-panel">
  <h2>board <span id="board-hint">working (commit &lt;12h) / idle / done</span></h2>
  <div id="board-cols">
    <div class="board-col"><h3>thinking</h3><div id="board-thinking"></div></div>
    <div class="board-col"><h3>working</h3><div id="board-working"></div></div>
    <div class="board-col"><h3>done</h3><div id="board-done"></div></div>
  </div>
</div>
<div id="board-tab" class="open" title="board">board</div>
<div id="stale-banner" class="hidden">STALE &mdash; generator silent <span id="stale-age"></span></div>
<div id="mouth">
  <div id="mouth-log"></div>
  <form id="mouth-form">
    <input id="mouth-input" type="text" maxlength="500" autocomplete="off"
           placeholder="ask the house&hellip; (what do you fear? why did the last cycle fail?)">
    <button type="submit">ask</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
